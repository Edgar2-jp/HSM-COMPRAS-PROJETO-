# Evita que o plano grátis do Supabase pause o projeto por inatividade (7 dias).
name: keepalive
on:
  schedule: [{ cron: '17 6 */3 * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "https://mjjpfomgxthzjtqzzfqs.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_UhlEoBQnKhZxNQWUnl8bFA_sGFnKzs4" -H "Content-Type: application/json" -d '{}'
